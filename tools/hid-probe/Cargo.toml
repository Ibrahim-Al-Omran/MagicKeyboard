[package]
name = "hid-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Read-only Windows HID report recorder and offline trace analyzer"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"

# Keep this developer tool independent from the repository's service workspace.
[workspace]
resolver = "2"
